[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citation-chaining"
version = "0.1.0"
description = "Persistent bidirectional scholarly citation chaining with OpenAlex and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
citation-chain = "citation_chain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
